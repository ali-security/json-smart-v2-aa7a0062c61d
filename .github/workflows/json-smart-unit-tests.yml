
name: json smart unit tests
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Maven surefire selector for json-smart tests (e.g. -Dtest=TestFoo -Dsurefire.failIfNoSpecifiedTests=false); empty runs the full suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java-version: [8, 11, 17, 21, 22, 23]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Cache local Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
          
      - name: Unit tests accessors-smart
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            cd accessors-smart; ./mvnw -B install -DskipTests
          else
            cd accessors-smart; ./mvnw -B install; ./mvnw -B clean test
          fi

      - name: Unit tests json-smart
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            cd json-smart; ./mvnw -B install -DskipTests; ./mvnw -B clean test ${{ inputs.test-filter }}
          else
            cd json-smart; ./mvnw -B install; ./mvnw -B clean test
          fi

      - name: Unit tests json-smart-action
        if: inputs.test-filter == ''
        run: cd json-smart-action; ./mvnw -B install; ./mvnw -B clean test

      - name: Build json-smart release jar
        if: matrix.java-version == 17
        run: cd json-smart; ./mvnw -B clean package -DskipTests -Dmaven.javadoc.skip=true -Dmaven.source.skip=true

      - name: Upload json-smart jar
        if: matrix.java-version == 17
        uses: actions/upload-artifact@v4
        with:
          name: json-smart-jar
          path: json-smart/target/json-smart-*.jar
          if-no-files-found: error
